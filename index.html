<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DWWM — Entraînement Oral</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="favicon.ico" />
</head>
<body>

<!-- ═══ BARRE DE NAVIGATION ═══ -->
<nav class="nav">
  <span class="nav-title">📚 DWWM Oral</span>
  <button class="nav-btn active" id="btn-quiz"   onclick="App.showPage('quiz')">Quiz</button>
  <button class="nav-btn"        id="btn-admin"  onclick="App.showPage('admin')">⚙️ Admin</button>
  <button class="nav-btn hidden" id="btn-logout" onclick="App.logout()"
          style="color:#e35336;border-color:#e35336">Déconnexion</button>
</nav>

<!-- ═══ PAGE QUIZ ═══ -->
<div class="page active" id="page-quiz">

  <!-- Onglets projets -->
  <div class="proj-tabs">
    <button class="ptab active" id="ptab-p1">Projet 1 — Django</button>
    <button class="ptab"        id="ptab-p2">Projet 2 — Node.js / Socket.io</button>
    <button class="ptab"        id="ptab-p3">Transversales</button>
    <!-- Onglet P4 : simule l'épreuve QCM + questions ouvertes en anglais du RE -->
    <button class="ptab"        id="ptab-p4">📝 Questionnaire Pro</button>
  </div>

  <!-- Filtres -->
  <div class="toolbar">
    <input  class="search-input" id="q-search" placeholder="Rechercher une question…" />
    <select class="filter-sel"   id="f-cat"><option value="">Toutes catégories</option></select>
    <select class="filter-sel"   id="f-them"><option value="">Toutes thématiques</option></select>
    <select class="filter-sel"   id="f-freq">
      <option value="">Tous niveaux</option>
      <option value="hot">🔴 Fréquentes</option>
      <option value="med">🔵 Techniques</option>
      <option value="easy">🟢 Générales</option>
    </select>
  </div>

  <!-- Statistiques dynamiques -->
  <div class="statsbar" id="q-stats"></div>

  <!-- Liste des questions (générée par quiz.js) -->
  <div id="q-list"></div>

</div>

<!-- ═══ PAGE ADMIN ═══ -->
<div class="page" id="page-admin">

  <div class="admin-header">
    <h1>Administration des questions</h1>
    <p>Créez, modifiez et exportez vos questions en XML.</p>
  </div>

  <!-- Barre d'actions -->
  <div class="admin-toolbar">
    <button class="btn btn-primary"   onclick="App.openModal()">+ Nouvelle question</button>
    <button class="btn btn-xml"       onclick="App.exportXML()">⬇ Export XML</button>
    <button class="btn btn-secondary" onclick="App.importXML()">⬆ Import XML</button>
    <input type="file" id="xml-file-input" accept=".xml"
           class="hidden" onchange="App.handleXMLImport(event)" />
    <button class="btn btn-secondary"
            title="Génère le code JS du Projet 1 à coller dans js/data-p1.js"
            onclick="App.copierCodeJS('p1')">📋 Copier JS — P1</button>
    <button class="btn btn-secondary"
            title="Génère le code JS du Projet 2 à coller dans js/data-p2.js"
            onclick="App.copierCodeJS('p2')">📋 Copier JS — P2</button>
    <button class="btn btn-secondary"
            title="Génère le code JS des questions transversales à coller dans js/data-p3.js"
            onclick="App.copierCodeJS('p3')">📋 Copier JS — P3</button>
    <button class="btn btn-secondary"
            title="Génère le code JS des questions du Questionnaire Pro à coller dans js/data-p4.js"
            onclick="App.copierCodeJS('p4')">📋 Copier JS — P4</button>
    <!-- Bouton reset : recharge les données depuis les fichiers data-*.js (efface localStorage) -->
    <button class="btn btn-reset"
            title="Efface le localStorage et recharge toutes les questions depuis les fichiers sources"
            onclick="App.reinitialiserDonnees()">🔄 Réinitialiser les données</button>

    <!-- Filtres admin -->
    <select class="filter-sel" id="a-proj">
      <option value="">Tous les projets</option>
      <option value="p1">Projet 1 — Django</option>
      <option value="p2">Projet 2 — Node.js</option>
      <option value="p3">Transversales</option>
      <option value="p4">Questionnaire Pro</option>
    </select>
    <input class="search-input" id="a-search"
           placeholder="Rechercher…" style="max-width:220px" />
  </div>

  <!-- Tableau (généré par admin.js) -->
  <div id="a-table-wrap"></div>

</div>

<!-- ═══ MODAL CRÉATION / ÉDITION ═══ -->
<div class="overlay hidden" id="modal-overlay">
  <div class="modal" id="modal">

    <div class="modal-head">
      <h2 id="modal-title">Nouvelle question</h2>
      <button class="modal-close" onclick="App.closeModal()">✕</button>
    </div>

    <div class="modal-body">
      <div class="field-row">
        <div class="field">
          <label for="m-proj">Projet *</label>
          <select id="m-proj">
            <option value="p1">Projet 1 — Django</option>
            <option value="p2">Projet 2 — Node.js</option>
            <option value="p3">Transversales</option>
            <option value="p4">Questionnaire Pro</option>
          </select>
        </div>
        <div class="field">
          <label for="m-freq">Fréquence *</label>
          <select id="m-freq">
            <option value="hot">🔴 Très fréquente</option>
            <option value="med">🔵 Technique</option>
            <option value="easy">🟢 Générale</option>
          </select>
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="m-cat">Catégorie *</label>
          <input type="text" id="m-cat" placeholder="ex : Sécurité" list="cat-datalist" />
          <datalist id="cat-datalist"></datalist>
        </div>
        <div class="field">
          <label for="m-them">Thématique</label>
          <input type="text" id="m-them" placeholder="ex : Node.js, Tests…" list="them-datalist" />
          <datalist id="them-datalist"></datalist>
        </div>
      </div>

      <div class="field">
        <label for="m-question">Question * (HTML autorisé : &lt;code&gt;, &lt;b&gt;)</label>
        <input type="text" id="m-question" placeholder="Qu'est-ce que…" />
      </div>

      <div class="field">
        <label for="m-answer">Réponse * (HTML : &lt;p&gt;, &lt;pre&gt;, &lt;code&gt;, &lt;b&gt;, &lt;ul&gt;&lt;li&gt;)</label>
        <textarea id="m-answer"
          placeholder="&lt;p&gt;Votre réponse…&lt;/p&gt;&#10;&lt;pre&gt;// code exemple&lt;/pre&gt;"></textarea>
      </div>
    </div>

    <div class="modal-foot">
      <button class="btn btn-secondary" onclick="App.closeModal()">Annuler</button>
      <button class="btn btn-primary"   onclick="App.saveQuestion()">Enregistrer</button>
    </div>

  </div>
</div>

<!-- ═══ OVERLAY DE CONNEXION ADMIN ═══ -->
<div class="overlay hidden" id="login-overlay">
  <div class="modal" id="login-modal" style="max-width:380px">

    <div class="modal-head">
      <h2>Accès administration</h2>
    </div>

    <div class="modal-body">
      <div class="field">
        <label for="login-user">Identifiant</label>
        <input type="text" id="login-user" placeholder="Identifiant" autocomplete="username" />
      </div>
      <div class="field">
        <label for="login-pwd">Mot de passe</label>
        <input type="password" id="login-pwd" placeholder="Mot de passe" autocomplete="current-password" />
      </div>
      <p id="login-error"
         style="font-size:13px;color:#e35336;min-height:18px;margin-top:4px"></p>
    </div>

    <div class="modal-foot">
      <button class="btn btn-secondary" onclick="App.showPage('quiz')">Annuler</button>
      <button class="btn btn-primary" id="login-submit"
              onclick="App.submitLogin()">Connexion</button>
    </div>

  </div>
</div>

<!-- ═══ TOAST ═══ -->
<div class="toast" id="toast"></div>

<!-- ═══ SCRIPTS (modules ES) ═══ -->
<script type="module" src="js/app.js"></script>

</body>
</html>
